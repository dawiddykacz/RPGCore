version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: rpg_database
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: rpg_test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: